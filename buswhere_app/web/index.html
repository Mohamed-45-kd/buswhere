<!DOCTYPE html>
<html lang="so">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <!-- Final viewport from the first byte. Flutter runs inside #app (below), so it never swaps this tag,
       which used to make the app flash narrow (laid out at desktop width) while starting. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="BusWhere — ogow halka uu basku joogo. Live city bus tracking for Hargeisa.">
  <meta name="theme-color" content="#12222E">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BusWhere">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>BusWhere</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12222E; overflow: hidden; overscroll-behavior: none; }
    #app { position: fixed; inset: 0; touch-action: none; }
    #splash { z-index: 10; position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #12222E; transition: opacity 200ms ease-out; }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash .dots { display: flex; gap: 8px; }
    #splash .dots span { width: 10px; height: 10px; border-radius: 5px; background: #5FD3D0; opacity: .35; }
    #splash .dots span.on { opacity: 1; }
    #splash p { margin: 0; font: 600 15px/22px system-ui, sans-serif; color: #C4D5DF; }
    @media (prefers-reduced-motion: no-preference) { #splash .dots span { transition: opacity 200ms; } }
  </style>
</head>
<body>
  <!-- Shown on slow data until Flutter draws its first frame. -->
  <div id="app"></div>
  <div id="splash" aria-label="BusWhere">
    <img src="icons/Icon-192.png" alt="">
    <div class="dots"><span></span><span></span><span></span></div>
    <p>Ogow halka uu basku joogo</p>
  </div>
  <script>
    (function () {
      var i = 0, dots = document.querySelectorAll('#splash .dots span');
      var t = setInterval(function () { dots.forEach(function (d, k) { d.className = k <= i % 3 ? 'on' : ''; }); i++; }, 400);
      window.addEventListener('flutter-first-frame', function () {
        clearInterval(t);
        var s = document.getElementById('splash');
        s.style.opacity = '0';
        setTimeout(function () { s.remove(); }, 250);
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
